<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14100d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="브루 카드">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>브루 카드</title>
<style>
:root{--bg:#f7f3ee;--fg:#1d1611;--mut:#5b4f45;--card:#fff;--line:#e2d8cd;--acc:#8a3b12;--hi:#fbe3cf;--cbg:#dbe7ff;--cfg:#133a7a;--obg:#d6f0dc;--ofg:#0e4d22;--btn:#5a3418;--btnfg:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#14100d;--fg:#f3ece4;--mut:#bcaea0;--card:#1f1915;--line:#3a302a;--acc:#ffad7a;--hi:#3e2918;--cbg:#1d2c4a;--cfg:#c2d6ff;--obg:#173a22;--ofg:#aee8bd;--btn:#e8b48a;--btnfg:#1d1611}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);word-break:keep-all;overflow-wrap:anywhere}
main{max-width:560px;margin:0 auto;padding:14px 16px 40px}
h1{font-size:22px;line-height:1.25;margin:4px 0 2px}
.sub{color:var(--mut);margin:0 0 12px;font-size:16px}
.spec{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 14px}
.dose{grid-row:span 2;font-size:46px;font-weight:800;line-height:1;padding-right:12px;border-right:1px solid var(--line);text-align:center}
.dose small{display:block;font-size:13px;font-weight:600;color:var(--mut);margin-top:4px}
.spec p{margin:0;font-size:16px}
.spec .grind{font-weight:700}.spec .grind span{display:inline-block}
.spec .row{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:16px;border-top:1px solid var(--line);padding-top:8px}
.spec .row b{font-weight:700}
.hint{color:var(--mut);font-size:14px;margin:0 0 6px}
.steps{list-style:none;padding:0;margin:0}
.steps li{margin:0 0 8px}
.step{display:grid;grid-template-columns:minmax(4.6em,auto) 1fr auto;grid-template-areas:"tm act g" "vb act g";gap:2px 10px;align-items:center;width:100%;text-align:left;font:inherit;color:var(--fg);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;min-height:72px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
.step .tm{grid-area:tm;white-space:nowrap;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.step .vb{grid-area:vb;justify-self:start}
.step .act{grid-area:act;font-size:19px;font-weight:600;line-height:1.3}
.step .g{grid-area:g;text-align:right;font-size:34px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.step .g small{display:block;font-size:13px;font-weight:600;color:var(--mut);margin-top:3px}
.step.cur{background:var(--hi);border-color:var(--acc)}
.step.cur .g{color:var(--acc)}
.badge{display:inline-block;border-radius:999px;padding:1px 9px;font-size:13px;font-weight:700}
.badge.c{background:var(--cbg);color:var(--cfg)}
.badge.o{background:var(--obg);color:var(--ofg)}
.tt{margin:14px 0 0;font-weight:800;font-size:19px}
.adj{margin:8px 0 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px}
.adj:empty{display:none}
.dose.chg{color:var(--acc)}
.scale{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-4px 0 14px}
.scale .lbl{color:var(--mut);font-size:15px;margin-right:auto}
.sbtn{font:inherit;font-size:22px;font-weight:800;line-height:1;min-width:48px;min-height:44px;border-radius:12px;border:2px solid var(--btn);background:transparent;color:var(--fg);touch-action:manipulation}
.sbtn:disabled{opacity:.35}
.scale output{min-width:3.2em;text-align:center;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.scale .tbtn{min-height:44px}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 0;flex-wrap:wrap}
.tbtn{font:inherit;font-size:15px;font-weight:700;min-height:48px;padding:8px 16px;border-radius:12px;border:2px solid var(--btn);background:transparent;color:var(--fg);touch-action:manipulation}
.tbtn[aria-pressed=true]{background:var(--btn);color:var(--btnfg)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.note{font-size:14px;color:var(--mut);margin:6px 0 0}
a{color:var(--acc)}
.list{list-style:none;padding:0;margin:12px 0}
.list a{display:block;text-decoration:none;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;min-height:60px}
.list b{display:block;font-size:18px}
.list span{color:var(--mut);font-size:15px}
.empty{text-align:center;padding:48px 8px}
.empty .big{font-size:24px;font-weight:800;margin:12px 0 6px}
.empty p{color:var(--mut);margin:4px 0}
.err .big{color:var(--acc)}
.upd{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--fg);color:var(--bg);border-radius:14px;padding:8px 8px 8px 16px;font-weight:700;box-shadow:0 4px 18px rgba(0,0,0,.3);z-index:9}
.upd button{font:inherit;font-weight:800;min-height:44px;padding:6px 14px;border-radius:10px;border:0;background:var(--bg);color:var(--fg)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
@media (max-width:360px){.dose{font-size:38px}.step .g{font-size:28px}.step .act{font-size:17px}}
</style>
</head>
<body>
<main>
  <section id="home" hidden>
    <div class="empty" id="homeEmpty" hidden>
      <div aria-hidden="true" style="font-size:48px">☕</div>
      <p class="big">QR을 스캔해 주세요</p>
      <p>레시피 QR을 카메라로 비추면 여기서 브루 카드가 열려요.</p>
    </div>
    <div id="homeList" hidden>
      <h1>최근 카드</h1>
      <p class="sub">눌러서 다시 열어요. 새 레시피는 QR을 스캔해 주세요.</p>
      <ul class="list" id="recent"></ul>
      <p style="text-align:center"><button type="button" class="tbtn" id="bClear">목록 지우기</button></p>
    </div>
    <p style="text-align:center;margin-top:20px"><a href="library.html">내 원두 노트 열기 →</a></p>
  </section>

  <section id="err" class="empty err" hidden>
    <div aria-hidden="true" style="font-size:48px">😥</div>
    <p class="big">카드를 열 수 없어요</p>
    <p id="errMsg"></p>
    <p><a href="#" class="home">최근 카드 보기</a></p>
  </section>

  <section id="card" hidden>
    <h1 id="hTitle"></h1>
    <p class="sub" id="hSub"></p>
    <div class="spec" id="spec"></div>
    <div class="scale" id="scale" hidden>
      <span class="lbl">원두량 바꾸기</span>
      <button type="button" class="sbtn" id="bMinus" aria-label="원두 1g 줄이기">−</button>
      <output id="gOut"></output>
      <button type="button" class="sbtn" id="bPlus" aria-label="원두 1g 늘리기">+</button>
      <button type="button" class="tbtn" id="bReset" hidden>원래대로</button>
    </div>
    <p class="note" id="scaleNote" hidden></p>
    <p class="hint">지금 하는 단계를 눌러 표시해요. 다시 누르면 다음 단계로 넘어가요.</p>
    <ol class="steps" id="steps" aria-label="추출 단계"></ol>
    <p class="tt" id="tt"></p>
    <p class="adj" id="adj"></p>
    <div class="tools">
      <button type="button" class="tbtn" id="bWake" aria-pressed="false" hidden>화면 켜두기</button>
      <a href="#" class="home">최근 카드 보기</a>
    </div>
    <p class="note" id="note" hidden></p>
    <p class="sr" id="live" aria-live="polite"></p>
  </section>
</main>
<div class="upd" id="upd" role="status" hidden><span>새 버전이 나왔어요</span><button type="button" id="bUpd">새로고침</button></div>
<script type="module" src="card.js"></script>
</body>
</html>
